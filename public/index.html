<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR فاکتور تکنو یدک</title>
<style>
body{margin:0;background:#eef2f7;font-family:Tahoma,Arial;color:#172033}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #0001}
button{width:100%;padding:15px;border:0;border-radius:16px;background:#2867df;color:#fff;font-size:17px;font-weight:bold;margin-top:12px}
input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ddd;border-radius:14px}.status{padding:14px;border-radius:16px;margin-top:12px;line-height:1.9}
.ok{background:#e9f8ef;color:#146b37}.err{background:#ffe9e9;color:#9a2020}.wait{background:#fff4df;color:#875700}
pre{white-space:pre-wrap;background:#f7f7f8;padding:12px;border-radius:14px}
</style></head><body><div class="wrap">
<div class="card"><h1>📦 کنترل سفارش تکنو یدک</h1>
<p>این نسخه OCR را از طریق سرور واسط انجام می‌دهد؛ API Key داخل گوشی قرار نمی‌گیرد.</p></div>
<div class="card"><h2>فاکتور</h2>
<input id="file" type="file" accept="image/*">
<button id="go">📷 خواندن فاکتور</button>
<div id="st" class="status wait">آماده</div>
<details><summary>متن خام OCR</summary><pre id="raw"></pre></details>
</div>
<script>
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{
 const f=$("file").files[0];
 if(!f){$("st").className="status err";$("st").textContent="ابتدا عکس فاکتور را انتخاب کن.";return}
 const fd=new FormData();fd.append("file",f);
 $("st").className="status wait";$("st").textContent="در حال ارسال فاکتور به سرور OCR...";
 try{
   const r=await fetch("/api/ocr",{method:"POST",body:fd});
   const d=await r.json();
   if(!r.ok||!d.ok)throw new Error(d.error||"خطای OCR");
   $("raw").textContent=d.text||"متنی پیدا نشد.";
   $("st").className="status ok";$("st").textContent="OCR با موفقیت انجام شد.";
 }catch(e){
   $("st").className="status err";$("st").textContent="OCR انجام نشد: "+e.message;
 }
};
</script></div></body></html>
