<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست OCR تکنو یدک</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;margin:0;padding:24px;color:#222}
.box{max-width:720px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}
button{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:16px;cursor:pointer}
pre{white-space:pre-wrap;background:#f1f3f5;padding:14px;border-radius:10px;min-height:120px}
.ok{color:#14833b}.err{color:#b42318}
</style>
</head>
<body>
<div class="box">
<h2>تست OCR تکنو یدک</h2>
<p>یک عکس فاکتور انتخاب کنید و متن OCR را دریافت کنید.</p>
<input id="file" type="file" accept="image/*" capture="environment">
<br><br>
<button id="btn">اجرای OCR</button>
<p id="status"></p>
<pre id="out">هنوز نتیجه‌ای دریافت نشده است.</pre>
</div>
<script>
const fileInput=document.getElementById("file");
const btn=document.getElementById("btn");
const statusEl=document.getElementById("status");
const out=document.getElementById("out");
btn.onclick=async()=>{
 const file=fileInput.files[0];
 if(!file){statusEl.className="err";statusEl.textContent="ابتدا یک عکس انتخاب کنید.";return;}
 btn.disabled=true;statusEl.className="";statusEl.textContent="در حال ارسال عکس برای OCR...";out.textContent="";
 try{
  const form=new FormData();
  form.append("file",file,file.name||"invoice.jpg");
  const r=await fetch("/api/ocr",{method:"POST",body:form});
  const data=await r.json();
  if(!r.ok||!data.ok) throw new Error(data.error||"OCR ناموفق بود");
  statusEl.className="ok";statusEl.textContent="OCR با موفقیت انجام شد.";
  out.textContent=data.text||"(متن قابل تشخیص پیدا نشد)";
 }catch(e){
  statusEl.className="err";statusEl.textContent="خطا: "+e.message;
 }finally{btn.disabled=false;}
};
</script>
</body>
</html>
