<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست OCR تکنو یدک</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;margin:0;padding:24px;color:#222}
.box{max-width:720px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}
button{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
pre{white-space:pre-wrap;background:#f1f3f5;padding:14px;border-radius:10px;min-height:120px;direction:rtl;text-align:right}
.ok{color:#14833b}.err{color:#b42318}.info{color:#444}
small{color:#666;line-height:1.8}
</style>
</head>
<body>
<div class="box">
<h2>تست OCR تکنو یدک</h2>
<p>یک عکس فاکتور انتخاب کنید. عکس قبل از ارسال به حداکثر حدود ۱ مگابایت فشرده می‌شود.</p>
<input id="file" type="file" accept="image/*" capture="environment">
<br><br>
<button id="btn">اجرای OCR</button>
<p id="status" class="info"></p>
<small id="info"></small>
<pre id="out">هنوز نتیجه‌ای دریافت نشده است.</pre>
</div>
<script>
const fileInput=document.getElementById("file");
const btn=document.getElementById("btn");
const statusEl=document.getElementById("status");
const out=document.getElementById("out");
const info=document.getElementById("info");

function compressImage(file,maxBytes=950000){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  const url=window.URL.createObjectURL(file);
  img.onload=()=>{
   window.URL.revokeObjectURL(url);
   let w=img.naturalWidth,h=img.naturalHeight;
   const maxSide=1800;
   if(Math.max(w,h)>maxSide){
    const s=maxSide/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s);
   }
   const canvas=document.createElement("canvas");
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext("2d");
   ctx.drawImage(img,0,0,w,h);
   let quality=0.82;
   const make=()=>canvas.toBlob(blob=>{
    if(!blob){reject(new Error("فشرده‌سازی عکس انجام نشد."));return;}
    if(blob.size<=maxBytes || quality<=0.45){
     resolve(new File([blob],"invoice.jpg",{type:"image/jpeg"}));
    }else{
     quality-=0.07; make();
    }
   },"image/jpeg",quality);
   make();
  };
  img.onerror=()=>{window.URL.revokeObjectURL(url);reject(new Error("خواندن عکس انجام نشد."));};
  img.src=url;
 });
}

btn.onclick=async()=>{
 const file=fileInput.files[0];
 if(!file){statusEl.className="err";statusEl.textContent="ابتدا یک عکس انتخاب کنید.";return;}
 btn.disabled=true;
 statusEl.className="info";
 statusEl.textContent="در حال آماده‌سازی عکس...";
 out.textContent="";info.textContent="";
 try{
  const smallFile=await compressImage(file);
  info.textContent=`حجم عکس اصلی: ${(file.size/1024/1024).toFixed(2)} MB — حجم ارسال: ${(smallFile.size/1024/1024).toFixed(2)} MB`;
  statusEl.textContent="در حال ارسال عکس برای OCR...";
  const form=new FormData();
  form.append("file",smallFile,smallFile.name);
  const r=await fetch("/api/ocr",{method:"POST",body:form});
  const data=await r.json().catch(()=>({ok:false,error:"پاسخ سرور قابل خواندن نیست."}));
  if(!r.ok||!data.ok){
   const details=[];
   if(data.debugCode) details.push("کد: "+data.debugCode);
   if(data.providerStatus) details.push("HTTP OCR: "+data.providerStatus);
   if(data.provider?.ErrorMessage) details.push("پیام OCR: "+data.provider.ErrorMessage);
   if(data.provider?.ErrorDetails) details.push("جزئیات OCR: "+data.provider.ErrorDetails);
   throw new Error((data.error||"OCR ناموفق بود")+(details.length?" | "+details.join(" | "):""));
  }
  statusEl.className="ok";
  statusEl.textContent="OCR با موفقیت انجام شد.";
  out.textContent=data.text||"(متن قابل تشخیص پیدا نشد)";
 }catch(e){
  statusEl.className="err";
  statusEl.textContent="خطا: "+e.message;
  console.error(e);
 }finally{btn.disabled=false;}
};
</script>
</body>
</html>
